<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Signal Audit — Find where you're deferring your authority." />
  <title>The Signal Audit — Deferred Authority</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F7F4EE;
      --card:     #EFEAE0;
      --text:     #1A1A1A;
      --muted:    #6B6560;
      --border:   #D4CEC4;
      --accent:   #2B3A4A;
      --accent2:  #4A5D6E;
      --warn:     #7A3D2E;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 52px 28px 72px;
    }

    /* ── Screens ──────────────────────────────────── */
    .screen {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .screen.active  { display: block; }
    .screen.visible { opacity: 1; transform: translateY(0); }

    /* ── Shared type ──────────────────────────────── */
    .eyebrow {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── Intro ────────────────────────────────────── */
    .intro-headline {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      font-size: clamp(26px, 5.5vw, 42px);
      line-height: 1.22;
      margin-bottom: 22px;
    }

    .intro-sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.72;
      max-width: 440px;
      margin-bottom: 52px;
    }

    /* ── Buttons ──────────────────────────────────── */
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #F7F4EE;
      border: none;
      padding: 15px 38px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: .09em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .15s;
      -webkit-appearance: none;
    }
    .btn:hover  { background: var(--accent2); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .back-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      margin-bottom: 40px;
      display: block;
      transition: color .2s;
    }
    .back-btn:hover { color: var(--text); }

    /* ── Progress dots ────────────────────────────── */
    .progress {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 48px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background .3s, width .3s, border-radius .3s;
    }
    .dot.done    { background: var(--accent); }
    .dot.current { background: var(--accent); width: 20px; border-radius: 3px; }

    /* ── Question ─────────────────────────────────── */
    .q-ctx {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .q-headline {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      font-size: clamp(19px, 3.8vw, 28px);
      line-height: 1.38;
      margin-bottom: 48px;
    }

    /* ── Sliders ──────────────────────────────────── */
    .slider-block { margin-bottom: 36px; }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 6px;
    }

    .slider-label { font-size: 14px; line-height: 1.45; flex: 1; }

    .slider-val {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
      min-width: 26px;
      text-align: right;
      flex-shrink: 0;
    }

    .slider-sub {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 14px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      outline: none;
      cursor: pointer;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        var(--accent) var(--fp, 44.44%),
        var(--border) var(--fp, 44.44%)
      );
    }
    input[type="range"]:focus { outline: none; }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #F7F4EE;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.32);
      transition: transform .15s;
    }
    input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }

    input[type="range"]::-moz-range-thumb {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #F7F4EE;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.32);
    }

    .slider-ends {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
    }
    .slider-ends span { font-size: 10px; color: var(--muted); letter-spacing: .04em; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0 36px;
    }

    /* ── Results ──────────────────────────────────── */
    .results-head {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      font-size: clamp(22px, 4.2vw, 34px);
      line-height: 1.28;
      margin-bottom: 8px;
    }

    .results-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 48px;
    }

    .gap-list { margin-bottom: 48px; }

    .gap-item { margin-bottom: 24px; }

    .gap-item-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    .gap-ctx-name { font-size: 13px; color: var(--text); }
    .gap-ctx-name.top { font-weight: 600; }

    .gap-num {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 20px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .gap-num.top { color: var(--warn); }

    .bar-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0;
      transition: width .9s cubic-bezier(.4,0,.2,1);
    }
    .bar-fill.top { background: var(--warn); }

    .insight-box {
      background: var(--card);
      border-left: 3px solid var(--accent);
      padding: 22px 26px;
      margin-bottom: 48px;
    }
    .insight-box p { font-size: 15px; line-height: 1.75; }
    .insight-box p + p { margin-top: 14px; }

    /* ── Email ────────────────────────────────────── */
    .email-head {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      font-size: clamp(20px, 4vw, 28px);
      line-height: 1.38;
      margin-bottom: 14px;
    }

    .email-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.68;
      margin-bottom: 36px;
    }

    .email-input {
      display: block;
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      border-radius: 0;
      margin-bottom: 12px;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    .email-input:focus { border-color: var(--accent); }
    .email-input::placeholder { color: #ADADAD; }
    .email-input.error { border-color: var(--warn); }

    .privacy { font-size: 11px; color: var(--muted); margin-top: 12px; }

    /* ── Success ──────────────────────────────────── */
    .success { padding: 56px 0 24px; }

    .success-mark {
      font-size: 32px;
      color: var(--accent);
      margin-bottom: 22px;
      line-height: 1;
    }

    .success-head {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .success-sub { font-size: 14px; color: var(--muted); line-height: 1.68; }

    @media (max-width: 380px) {
      #app { padding: 36px 20px 52px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Intro -->
  <div id="screen-intro" class="screen active">
    <p class="eyebrow">Deferred Authority &middot; The Signal Audit</p>
    <h1 class="intro-headline">You don't have a confidence problem.<br>You have a timing problem.<br>Find out where.</h1>
    <p class="intro-sub">For faith-driven professionals who suspect that staying small was never actually humility.</p>
    <button class="btn" onclick="goTo('1')">Start the audit</button>
  </div>

  <!-- Questions (content injected by JS) -->
  <div id="screen-1" class="screen"></div>
  <div id="screen-2" class="screen"></div>
  <div id="screen-3" class="screen"></div>
  <div id="screen-4" class="screen"></div>
  <div id="screen-5" class="screen"></div>

  <!-- Results (content injected by JS) -->
  <div id="screen-results" class="screen"></div>

  <!-- Email capture (content injected by JS) -->
  <div id="screen-email" class="screen"></div>

</div>

<script>
  /* ── Config ─────────────────────────────────────── */
  const WEBHOOK = 'https://hook.eu2.make.com/dv46bgvt6xbvytums55vgab9xq92lx13';

  /* ── Data ───────────────────────────────────────── */
  const QUESTIONS = [
    {
      ctx: 'Team Meeting',
      hed: 'You’re in a team meeting. Something isn’t working and you know it.',
    },
    {
      ctx: 'One-on-One with Your Manager',
      hed: 'You’re in a one-on-one with your manager. You have a read on the real dynamic.',
    },
    {
      ctx: 'A Negotiation',
      hed: 'You’re in a negotiation — salary, contract, terms. You know what it’s worth.',
    },
    {
      ctx: 'Church or Ministry Leadership',
      hed: 'You’re in a church or ministry setting. You see what’s needed. You hold a position.',
    },
    {
      ctx: 'A Moment of Conflict',
      hed: 'You’re in direct conflict with someone. You can see what’s actually happening.',
    },
  ];

  const CTX_SHORT = [
    'team meetings',
    'one-on-ones with your manager',
    'negotiations',
    'church or ministry leadership',
    'conflict',
  ];

  // Three tiers: 0 = gap 0–2, 1 = gap 3–4, 2 = gap 5+
  const INSIGHT = [
    [ // team meeting
      'Your clarity and signal are close here. You’re showing up in the room.',
      'You catch the undercurrent before anyone names it — and then you let the meeting proceed without your read in it. There’s a filter running that’s deciding what’s safe to say.',
      `You clock the actual problem early — usually before anyone names it out loud. Then you wait. You wait for someone with more standing to say it first, or for the moment to pass on its own. Neither happens, so the meeting ends with the wrong problem being solved.</p><p>That\’s not modesty. The gift you saw the problem with was given to you to use, not to sit on — the parable of the talents isn\’t subtle about what happens to the one who buries what he was given for safekeeping. Staying quiet in that room isn\’t humility. It\’s fear, dressed up as deference to people who weren\’t actually waiting for your silence.`,
    ],
    [ // one-on-one
      'You’re reasonably direct with your manager. That’s harder than it looks.',
      'You have a clearer view of the dynamic than you show. That’s not professionalism — it’s information asymmetry you’re choosing to maintain.',
      `You read the real dynamic clearly — what\’s actually being asked of you, what\’s not being said, where the conversation is actually headed. Then, in the room, you soften it. You let your manager set the frame even when you can see it\’s the wrong one.</p><p>You were made to reflect and represent — to image something true into a room, not just absorb whatever\’s put in front of you. Holding back an accurate read out of deference isn\’t respect for their authority. It\’s deferring authority that was never theirs to hold in the first place — yours, on loan from God, not from the org chart.`,
    ],
    [ // negotiation
      'Your read and your offer are roughly aligned. You’re not leaving as much on the table as you think.',
      'You know the number before they make their offer. You let them anchor anyway. The gap isn’t modesty — it costs you something real every time.',
      `You know what it\’s worth. You know what you\’re worth. And at the table, you let the number — or the silence — speak for you instead.</p><p>Undervaluing what you bring isn\’t humility either. Humility is accurate self-assessment, not self-erasure. If God entrusted you with the skill, the track record, the judgment that makes this negotiation worth having — naming its value plainly is just telling the truth about what was given to you. Underselling it isn\’t godliness. It\’s just a quieter way of getting it wrong.`,
    ],
    [ // church/ministry
      'You’re speaking into your ministry context with some consistency. That’s not nothing.',
      'There’s something particular about spiritual authority — easier to defer, harder to claim. It’s worth asking whether the restraint is discernment or whether it’s borrowed silence.',
      `This is the room where the gap usually runs deepest — and it makes sense. You hold a position. You see what\’s needed. And somewhere along the way, you absorbed the idea that authority is dangerous and visibility is prideful, so staying small got relabeled as godliness.</p><p>But Genesis doesn\’t say God made you small and quiet. It says you were made to image Him — to reflect something true and active into whatever you\’re given charge over. Burying that under the language of humility isn\’t humility. It\’s fear wearing a Bible verse. The correction isn\’t to get louder. It\’s to stop asking permission for the authority you were already given.`,
    ],
    [ // conflict
      'You’re naming things in conflict. That takes more than most people bring.',
      'You see what’s happening mid-conflict — the real issue, the pattern. You say part of it. There’s a hold on the rest that probably feels like wisdom. It may not be.',
      `You see the real thing at minute two. You say it at minute twenty — or not at all. By then you\’ve absorbed what wasn\’t yours to carry, and the moment for a clean, true naming has passed.</p><p>Conflict is exactly where accurate seeing was supposed to be used, not stored. Peacekeeping that requires you to misrepresent what you actually see isn\’t peace — it\’s postponement, and somebody\’s still paying for it. Naming the true thing early, while it\’s still namable, is the more honest form of love in the room. It\’s also the harder one.`,
    ],
  ];

  /* ── State ──────────────────────────────────────── */
  const answers = QUESTIONS.map(() => ({ clarity: 5, signal: 5 }));
  let busy = false;

  /* ── Question renderer ──────────────────────────── */
  function renderQ(n) {
    const i = n - 1;
    const q = QUESTIONS[i];
    const a = answers[i];
    const el = document.getElementById('screen-' + n);

    const dots = QUESTIONS.map((_, di) => {
      if (di < i)   return '<div class="dot done"></div>';
      if (di === i) return '<div class="dot current"></div>';
      return '<div class="dot"></div>';
    }).join('');

    const isLast = n === QUESTIONS.length;
    const backTarget = n > 1 ? String(n - 1) : 'intro';
    const nextAction = isLast ? 'buildResults()' : 'goTo(\'' + (n + 1) + '\')';

    el.innerHTML =
      '<button class="back-btn" onclick="goTo(\'' + backTarget + '\')">← Back</button>' +
      '<div class="progress">' + dots + '</div>' +
      '<p class="q-ctx">' + q.ctx + '</p>' +
      '<h2 class="q-headline">' + q.hed + '</h2>' +

      '<div class="slider-block">' +
        '<div class="slider-header">' +
          '<span class="slider-label">How clearly do you see what’s really going on?</span>' +
          '<span class="slider-val" id="cv-' + n + '">' + a.clarity + '</span>' +
        '</div>' +
        '<p class="slider-sub">Internal clarity</p>' +
        '<input type="range" min="1" max="10" value="' + a.clarity + '" id="cr-' + n + '" ' +
          'oninput="onSlider(' + n + ',\'clarity\',this)">' +
        '<div class="slider-ends"><span>Not at all</span><span>Completely</span></div>' +
      '</div>' +

      '<hr class="divider">' +

      '<div class="slider-block">' +
        '<div class="slider-header">' +
          '<span class="slider-label">How fully do you say it out loud?</span>' +
          '<span class="slider-val" id="sv-' + n + '">' + a.signal + '</span>' +
        '</div>' +
        '<p class="slider-sub">External signal</p>' +
        '<input type="range" min="1" max="10" value="' + a.signal + '" id="sr-' + n + '" ' +
          'oninput="onSlider(' + n + ',\'signal\',this)">' +
        '<div class="slider-ends"><span>Not at all</span><span>Fully</span></div>' +
      '</div>' +

      '<button class="btn" onclick="' + nextAction + '">' +
        (isLast ? 'See my results' : 'Next') +
      '</button>';
  }

  function onSlider(n, key, input) {
    const val = parseInt(input.value);
    answers[n - 1][key] = val;
    document.getElementById(key === 'clarity' ? 'cv-' + n : 'sv-' + n).textContent = val;
    setFill(input);
  }

  function setFill(input) {
    const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
    input.style.setProperty('--fp', pct + '%');
  }

  function initFills() {
    document.querySelectorAll('input[type="range"]').forEach(setFill);
  }

  /* ── Results builder ────────────────────────────── */
  function buildResults() {
    const gaps = answers.map(function(a, i) {
      return {
        i: i,
        ctxFull: QUESTIONS[i].ctx,
        gap: a.clarity - a.signal,
        clarity: a.clarity,
        signal: a.signal,
      };
    });

    const maxGap = Math.max.apply(null, gaps.map(function(g) { return g.gap; }));
    const topEntry = maxGap > 0
      ? gaps.reduce(function(best, g) { return g.gap > best.gap ? g : best; }, gaps[0])
      : null;

    const avgGap = gaps.reduce(function(s, g) { return s + g.gap; }, 0) / gaps.length;

    let patternLabel;
    if (avgGap >= 5)        patternLabel = 'Chronic Deferred Authority';
    else if (avgGap >= 3)   patternLabel = 'Selective Deferred Authority';
    else if (avgGap >= 1.5) patternLabel = 'Situational Signal Gap';
    else                    patternLabel = 'Aligned Signal';

    const barRows = gaps.map(function(g) {
      const isTop = topEntry && g.i === topEntry.i;
      const barW  = maxGap > 0 ? Math.max(0, (g.gap / 10) * 100) : 0;
      const gStr  = g.gap > 0 ? ('+' + g.gap) : String(g.gap);
      return (
        '<div class="gap-item">' +
          '<div class="gap-item-head">' +
            '<span class="gap-ctx-name' + (isTop ? ' top' : '') + '">' + QUESTIONS[g.i].ctx + '</span>' +
            '<span class="gap-num' + (isTop ? ' top' : '') + '">' + gStr + '</span>' +
          '</div>' +
          '<div class="bar-track">' +
            '<div class="bar-fill' + (isTop ? ' top' : '') + '" data-w="' + barW + '"></div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    let insightHTML;
    if (!topEntry || topEntry.gap <= 0) {
      insightHTML =
        '<p>Your clarity and signal are closely aligned across contexts. ' +
        'That’s the baseline — the work from here is sustaining it under pressure.</p>';
    } else {
      const tier = topEntry.gap >= 5 ? 2 : topEntry.gap >= 3 ? 1 : 0;
      insightHTML =
        '<p>Your biggest gap is in <strong>' + topEntry.ctxFull.toLowerCase() + '</strong>.</p>' +
        '<p>' + INSIGHT[topEntry.i][tier] + '</p>';
    }

    document.getElementById('screen-results').innerHTML =
      '<button class="back-btn" onclick="goTo(\'5\')">← Back</button>' +
      '<p class="eyebrow">Your Signal Audit</p>' +
      '<h2 class="results-head">' + patternLabel + '</h2>' +
      '<p class="results-sub">Average gap ' + avgGap.toFixed(1) + ' &middot; clarity score minus signal score</p>' +
      '<div class="gap-list">' + barRows + '</div>' +
      '<div class="insight-box">' + insightHTML + '</div>' +
      '<button class="btn" onclick="goTo(\'email\')">Get the full breakdown</button>';

    goTo('results');

    setTimeout(function() {
      document.querySelectorAll('.bar-fill').forEach(function(bar) {
        bar.style.width = bar.dataset.w + '%';
      });
    }, 450);
  }

  /* ── Email builder ──────────────────────────────── */
  function buildEmail() {
    document.getElementById('screen-email').innerHTML =
      '<button class="back-btn" onclick="goTo(\'results\')">← Back</button>' +
      '<p class="eyebrow">One more step</p>' +
      '<h2 class="email-head">Want the full breakdown of your pattern and the one correction for it?</h2>' +
      '<p class="email-sub">Drop your email. No sequences, no noise — just the specific insight for where you’re deferring and what to do about it.</p>' +
      '<div id="email-form">' +
        '<input type="email" class="email-input" id="email-field" placeholder="your@email.com" autocomplete="email" ' +
          'onkeydown="if(event.key===\'Enter\')submitEmail()">' +
        '<button class="btn" onclick="submitEmail()">Send it</button>' +
        '<p class="privacy">Not shared. Unsubscribe any time.</p>' +
      '</div>' +
      '<div id="email-success" class="success" style="display:none">' +
        '<div class="success-mark">✓</div>' +
        '<h3 class="success-head">You’re in.</h3>' +
        '<p class="success-sub">Check your inbox. The breakdown is on its way.</p>' +
      '</div>';
  }

  async function submitEmail() {
    const input = document.getElementById('email-field');
    const email = input.value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      input.classList.add('error');
      input.focus();
      return;
    }
    input.classList.remove('error');

    const payload = {
      email: email,
      submittedAt: new Date().toISOString(),
      answers: answers.map(function(a, i) {
        return {
          context: CTX_SHORT[i],
          clarity: a.clarity,
          signal: a.signal,
          gap: a.clarity - a.signal,
        };
      }),
    };

    try {
      await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (_) { /* fail silently */ }

    document.getElementById('email-form').style.display = 'none';
    document.getElementById('email-success').style.display = 'block';
  }

  /* ── Navigation ─────────────────────────────────── */
  function goTo(id) {
    if (busy) return;
    busy = true;

    var idStr = String(id);

    // Pre-build dynamic screens before showing them
    if (idStr === 'email') buildEmail();
    var numId = parseInt(idStr);
    if (!isNaN(numId) && numId >= 1 && numId <= 5) renderQ(numId);

    var current = document.querySelector('.screen.active');
    var next    = document.getElementById('screen-' + idStr);
    if (!next) { busy = false; return; }

    if (current && current !== next) {
      current.classList.remove('visible');
      setTimeout(function() {
        current.classList.remove('active');
        revealScreen(next);
      }, 270);
    } else {
      revealScreen(next);
    }
  }

  function revealScreen(el) {
    el.classList.add('active');
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        el.classList.add('visible');
        window.scrollTo(0, 0);
        if (el.querySelector('input[type="range"]')) initFills();
        setTimeout(function() { busy = false; }, 380);
      });
    });
  }

  /* ── Init ───────────────────────────────────────── */
  (function() {
    var intro = document.getElementById('screen-intro');
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        intro.classList.add('visible');
      });
    });
  })();
</script>
</body>
</html>
